<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css"/>
  <script src="utiles.js"></script>
</head>

<body onload="iniciarJuego()">

  <div class="overlay">

    <header>
      <h1>Juego Cazando</h1>
      <p class="autor">Autor: Rabetomo</p>
    </header>

    <div class="layout">

      <!-- IZQUIERDA -->
      <div class="side-panel">
        <h3>PUNTOS</h3>
        <div id="txtxpuntos">0</div>
      </div>

      <!-- CENTRO -->
      <div class="centro">
        <canvas id="areaJuego" width="500" height="500"></canvas>

        <div class="controles">
          <div class="grid-controles">
            <button onclick="moverArriba()">⬆</button>
            <button onclick="moverIzquierda()">⬅</button>
            <button onclick="moverAbajo()">⬇</button>
            <button onclick="moverDerecha()">➡</button>
          </div>

          <button class="btn-restart" onclick="reiniar()">🔶 REINICIAR</button>
        </div>
      </div>

      <!-- DERECHA -->
      <div class="side-panel">
        <h3>TIEMPO</h3>
        <div id="txtxtiempo">10</div>
      </div>

    </div>

    <p id="mensaje"></p>

  </div>

  <script src="cazando.js"></script>
</body>
</html>
